name: Docker Image CI
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: 'Login to GitHub Container Registry'
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{github.actor}}
        password: ${{secrets.GITHUB_TOKEN}}
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Build the Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        push: true
        tags: ghcr.io/webteamchesh/nextjs-block:${{ github.run_number }}
  job2:
    runs-on: ubuntu-latest
    needs: build
    env:
      REGISTRY: ghcr.io
      APP_IMAGE: ghcr.io/webteamchesh/nextjs-block:${{ github.run_number }}
    steps:
    - name: Sleep for 15 seconds
      run: sleep 15s
      shell: bash
    - name: contensis block push action
      uses: contensis/block-push@v1
      with:
        block-id: nextjs-c4c
        alias: chesheast
        project-id: website
        image-uri: ghcr.io/webteamchesh/nextjs-block:${{ github.run_number }}
        client-id: ${{ secrets.client_id }}
        shared-secret: ${{ secrets.shared_secret }}
        git-token: ${{ secrets.github_token }}
